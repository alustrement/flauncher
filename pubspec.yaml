name: flauncher
description: Flutter-based Android TV launcher.

version: 0.0.1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.3
  drift: ^2.35.3
  path_provider: ^2.1.6
  path: ^1.9.1
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.2
  lints: ^6.1.0
  mockito: ^5.8.1
  drift_dev: ^2.35.2
  network_image_mock: ^2.1.1
  transparent_image: ^2.0.1
  shared_preferences_platform_interface: ^2.4.2
  package_info_plus_platform_interface: ^4.1.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
